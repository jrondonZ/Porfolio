<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Josiah Rondon | Interactive Neural Portfolio</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
		<style>
			:root {
				--cyan: #00dfff;
				--blue: #2457ff;
				--gold: #ffe96a;
				--violet: #8d73ff;
				--rose: #ffb6c9;
				--text: #f5fbff;
			}
			* {
				box-sizing: border-box;
			}
			html, body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #000;
				color: var(--text);
				font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			body {
				background: radial-gradient(circle at 52% 43%, rgba(0,210,255,.09), transparent 32%),
					radial-gradient(circle at 61% 36%, rgba(255,232,106,.045), transparent 22%),
					#00050b;
			}
			#scene {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				display: block;
				z-index: 0;
				touch-action: none;
			}
			.vignette {
				position: fixed;
				inset: 0;
				z-index: 3;
				pointer-events: none;
				background: radial-gradient(circle at 50% 45%, transparent 38%, rgba(0,0,0,.62) 74%, #000 100%);
			}
			.scan {
				position: fixed;
				inset: 0;
				z-index: 4;
				pointer-events: none;
				opacity: .075;
				background: linear-gradient(to bottom, transparent 0 48%, rgba(0,210,255,.15) 49%, transparent 50% 100%);
				background-size: 100% 8px;
				mix-blend-mode: screen;
			}
			.name {
				position: fixed;
				left: 50%;
				bottom: 6.3vh;
				transform: translateX(-50%);
				z-index: 8;
				text-align: center;
				pointer-events: none;
				transition: .55s ease;
			}
			.name h1 {
				margin: 0;
				font-size: clamp(2rem, 5.3vw, 5rem);
				line-height: .9;
				letter-spacing: .13em;
				text-transform: uppercase;
				font-weight: 900;
				background: linear-gradient(90deg, #fff 0%, var(--cyan) 38%, var(--gold) 70%, var(--violet));
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
				text-shadow: 0 0 42px rgba(0,210,255,.18);
			}
			.name p {
				margin: .72rem 0 0;
				color: rgba(218,240,255,.68);
				font-size: clamp(.7rem, 1.15vw, .9rem);
				letter-spacing: .30em;
				text-transform: uppercase;
				font-weight: 800;
			}
			body.zoomed .name {
				opacity: .11;
				transform: translateX(-50%) translateY(18px) scale(.94);
				filter: blur(3px);
			}
			.hint {
				position: fixed;
				left: 50%;
				top: 5vh;
				transform: translateX(-50%);
				z-index: 8;
				padding: 8px 14px;
				border: 1px solid rgba(255,255,255,.10);
				border-radius: 999px;
				background: rgba(0,0,0,.34);
				backdrop-filter: blur(14px);
				color: rgba(218,240,255,.66);
				font-size: .78rem;
				letter-spacing: .08em;
				white-space: nowrap;
				pointer-events: none;
				transition: .35s ease;
			}
			body.zoomed .hint {
				opacity: .16;
			}
			.panel {
				position: fixed;
				z-index: 12;
				right: clamp(14px, 4vw, 54px);
				top: 50%;
				transform: translateY(-50%) translateX(18px) scale(.98);
				width: min(395px, calc(100vw - 28px));
				max-height: 70vh;
				overflow: auto;
				opacity: 0;
				pointer-events: none;
				padding: 24px;
				border-radius: 26px;
				border: 1px solid rgba(255,255,255,.13);
				background: rgba(2,8,18,.74);
				backdrop-filter: blur(30px) saturate(145%);
				box-shadow: 0 28px 88px rgba(0,0,0,.64), inset 0 0 54px rgba(0,210,255,.035);
				transition: .45s cubic-bezier(.16,1,.3,1);
			}
			.panel.active {
				opacity: 1;
				pointer-events: auto;
				transform: translateY(-50%) translateX(0) scale(1);
			}
			.kicker {
				font: 700 .72rem "Fira Code", monospace;
				color: var(--gold);
				letter-spacing: .16em;
				text-transform: uppercase;
				margin-bottom: 9px;
			}
			.panel h2 {
				margin: 0 0 11px;
				font-size: 1.85rem;
				letter-spacing: -.04em;
				background: linear-gradient(90deg, #fff, var(--cyan), var(--violet));
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
			}
			.panel p {
				color: #a9c9dd;
				line-height: 1.68;
				font-size: .94rem;
			}
			.panel strong {
				color: #fff;
			}
			.panel a {
				color: var(--cyan);
			}
			.close {
				width: 100%;
				margin-top: 12px;
				border: 1px solid rgba(0,210,255,.34);
				background: rgba(0,210,255,.07);
				color: var(--cyan);
				border-radius: 999px;
				padding: 11px 13px;
				font: 900 .84rem Inter, sans-serif;
				cursor: pointer;
			}
			.label {
				position: fixed;
				z-index: 10;
				transform: translate(-50%,-50%);
				padding: 5px 10px;
				border-radius: 999px;
				background: rgba(0,0,0,.55);
				border: 1px solid rgba(0,210,255,.32);
				color: #fff;
				font: 900 10px Inter, sans-serif;
				letter-spacing: .14em;
				text-transform: uppercase;
				white-space: nowrap;
				pointer-events: none;
				opacity: 0;
				transition: .16s ease;
				box-shadow: 0 0 18px rgba(0,210,255,.23);
			}
			.label.visible {
				opacity: 1;
				transform: translate(-50%,-65%);
			}
			@media(max-width:760px) {
				.hint {
					top: 4vh;
					font-size: .7rem;
				}
				.name {
					bottom: 5vh;
				}
				.panel {
					left: 14px;
					right: 14px;
					top: auto;
					bottom: 14px;
					width: auto;
					max-height: 52vh;
					padding: 20px;
					border-radius: 22px;
					transform: translateY(22px) scale(.98);
				}
				.panel.active {
					transform: translateY(0) scale(1);
				}
			}
		</style>
	</head>
	<body>
		<canvas id="scene"></canvas>
		<div class="name">
			<h1>Josiah Rondon</h1>
			<p>Interactive Neural Portfolio</p>
		</div>
		<aside class="panel" id="panel">
			<div class="kicker" id="kicker"></div>
			<h2 id="title"></h2>
			<div id="content"></div>
			<button class="close" id="closeBtn">Back to Brain</button>
		</aside>
		<div class="label" id="label"></div>
		<div class="vignette"></div>
		<div class="scan"></div>
		<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
					"three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
				}
			}
		</script>
		<script type="module">
			import * as THREE from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
			import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
			import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
			import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

			const DATA = {
				about: {
					title: 'About Me',
					kicker: 'Frontal Lobe',
					html: `<p>I’m a <strong>Computer Science student at Connecticut College</strong> focused on AI, automation, enterprise systems, and full-stack engineering.</p><p>Currently, I work as a <strong>Software Engineer Intern at Yale ITS</strong>, building practical AI and workflow solutions.</p>`
				},
				skills: {
					title: 'Skills',
					kicker: 'Parietal Network',
					html: `<p><strong>Languages:</strong> Python, Ruby, Java, JavaScript, SQL, Node.js.</p><p><strong>Tools:</strong> Git, Docker, Azure, Intune, Jira, CI/CD.</p><p><strong>Focus:</strong> REST APIs, OAuth 2.0, OpenAI integrations, LLM workflows, and generative AI systems.</p>`
				},
				experience: {
					title: 'Experience',
					kicker: 'Motor Cortex',
					html: `<p><strong>Software Engineer Intern — Yale ITS</strong><br>AI chatbot work, OAuth 2.0 proof-of-concepts, and modern engineering workflows.</p><p><strong>Central ITS Technician Intern — Yale ITS</strong><br>Large-scale recovery, provisioning, and technical operations.</p>`
				},
				projects: {
					title: 'Projects',
					kicker: 'Temporal Memory',
					html: `<p><strong>Enterprise AI Chatbot</strong><br>Production-oriented workflow using OutSystems, OpenAI, and SharePoint integration concepts.</p><p><strong>Genomic Structural Variation Analysis</strong><br>Explored ensemble methods, microhomology quantification, and semi-supervised ML ideas.</p>`
				},
				contact: {
					title: 'Contact',
					kicker: 'Brainstem Signal',
					html: `<p>New Haven, Connecticut<br>Bilingual Spanish / English</p><p><a href="https://www.linkedin.com/in/josiah-rondon-57a309292/" target="_blank" rel="noreferrer">LinkedIn</a> · <a href="https://github.com/jrondonz" target="_blank" rel="noreferrer">GitHub</a> · <a href="mailto:youremail@example.com">Email</a></p>`
				}
			};

			const canvas = document.getElementById('scene');
			const renderer = new THREE.WebGLRenderer({
				canvas,
				antialias: true,
				alpha: true,
				powerPreference: 'high-performance'
			});
			renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.55));
			renderer.setSize(innerWidth, innerHeight);
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.toneMappingExposure = .92;
			renderer.outputColorSpace = THREE.SRGBColorSpace;

			const scene = new THREE.Scene();
			scene.fog = new THREE.FogExp2(0x020812, .045);
			const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .05, 100);
			camera.position.set(0, .14, 7.55);

			const controls = new OrbitControls(camera, renderer.domElement);
			controls.enableDamping = true;
			controls.dampingFactor = .055;
			controls.autoRotate = true;
			controls.autoRotateSpeed = .18;
			controls.enablePan = false;
			controls.minDistance = 3.15;
			controls.maxDistance = 9.5;
			controls.target.set(.16, .03, 0);

			const composer = new EffectComposer(renderer);
			composer.addPass(new RenderPass(scene, camera));
			const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .88, .52, .13);
			composer.addPass(bloom);
			composer.addPass(new OutputPass());

			scene.add(new THREE.AmbientLight(0x071421, .52));
			const key = new THREE.DirectionalLight(0xb8eaff, 1.7);
			key.position.set(4, 5, 6);
			scene.add(key);
			const rim = new THREE.DirectionalLight(0x00dfff, 1.35);
			rim.position.set(-6, 2, -4);
			scene.add(rim);
			const warm = new THREE.PointLight(0xffe96a, 1.55, 9);
			warm.position.set(1.7, 1.3, 2.5);
			scene.add(warm);
			const blue = new THREE.PointLight(0x244cff, 1.55, 10);
			blue.position.set(-2.4, -.6, 1.8);
			scene.add(blue);

			const brainGroup = new THREE.Group();
			brainGroup.position.set(0, .12, 0);
			brainGroup.rotation.set(-.03, .05, 0);
			scene.add(brainGroup);

			const C = {
				cyan: new THREE.Color('#00dfff'),
				blue: new THREE.Color('#2457ff'),
				gold: new THREE.Color('#ffe96a'),
				white: new THREE.Color('#e9fbff'),
				violet: new THREE.Color('#806cff'),
				rose: new THREE.Color('#ffb6c9'),
				shadow: new THREE.Color('#031325')
			};

			const low = innerWidth < 760 || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) || (navigator.deviceMemory && navigator.deviceMemory <= 4);
			const positions = [], base = [], colors = [], sizes = [], groovePositions = [], cleftPositions = [];

			function directionalFold(x, y, z, centerX) {
				return Math.sin(y * 9.5 + x * 2.25) * .052 + Math.sin(y * 15.0 - z * 2.0) * .032 + Math.sin((x - centerX) * 7.5 + y * 4.2) * .022;
			}

			function pushPoint(x, y, z, cA, cB, sizeMin = .010, sizeMax = .030, centerX = 0) {
				const cleft = Math.max(0, 1 - Math.abs(x) / .26);
				y -= cleft * .25;
				z *= 1 - cleft * .16;
				const ridge = directionalFold(x, y, z, centerX);
				x += Math.sign(x - centerX || 1) * ridge * .42;
				y += ridge * .30;
				z += Math.sign(z || 1) * ridge * .38;
				positions.push(x, y, z);
				base.push(x, y, z);
				let c = cA.clone().lerp(cB, Math.random() * .78);
				if (Math.random() > .935) c.lerp(C.white, .20);
				if (cleft > .35) c.lerp(C.shadow, .64);
				colors.push(c.r, c.g, c.b);
				sizes.push(THREE.MathUtils.randFloat(sizeMin, sizeMax));
			}

			function lobePoint(center, scale, count, cA, cB, opts = {}) {
				for (let i = 0; i < count; i++) {
					const u = Math.random() * Math.PI * 2,
						v = Math.acos(2 * Math.random() - 1),
						r = Math.cbrt(Math.random());
					let x = center[0] + Math.sin(v) * Math.cos(u) * scale[0] * r,
						y = center[1] + Math.cos(v) * scale[1] * r,
						z = center[2] + Math.sin(v) * Math.sin(u) * scale[2] * r;
					if (opts.frontal) {
						x += .12 * Math.max(0, y + .1);
						z *= 1.12;
					}
					if (opts.temporal) {
						y -= .10 * Math.max(0, 1 - r);
						z *= 1.02;
					}
					if (opts.occipital) {
						x -= .05 * Math.max(0, .3 - y);
						z *= 1.06;
					}
					pushPoint(x, y, z, cA, cB, opts.minSize || .010, opts.maxSize || .030, center[0]);
				}
			}

			// Fuller anatomy-first construction: wider/deeper lobes so it reads as a full brain, not a skinny side profile.
			lobePoint([.90, .28, .02], [.98, .72, .76], low ? 8000 : 17000, C.cyan, C.gold, { frontal: true });
			lobePoint([-.18, .52, .00], [1.20, .84, .78], low ? 8800 : 18500, C.blue, C.cyan);
			lobePoint([-1.08, .18, -.02], [.82, .70, .68], low ? 5700 : 12300, C.blue, C.violet, { occipital: true });
			lobePoint([.18, -.50, .07], [1.06, .47, .64], low ? 5600 : 11600, C.cyan, C.violet, { temporal: true });
			lobePoint([-.74, -.75, .02], [.68, .38, .45], low ? 3100 : 7000, C.blue, C.gold);
			lobePoint([-.12, -.02, .07], [.82, .34, .36], low ? 2800 : 6500, C.white, C.cyan, { minSize: .009, maxSize: .022 });
			lobePoint([.32, .08, .10], [.40, .27, .28], low ? 1400 : 3300, C.gold, C.white, { minSize: .009, maxSize: .020 });

			const stemN = low ? 1400 : 3100;
			for (let i = 0; i < stemN; i++) {
				const t = i / stemN,
					a = Math.random() * Math.PI * 2,
					r = (.14 * (1 - t) + .044) * Math.sqrt(Math.random()),
					bend = -.11 * Math.sin(t * Math.PI),
					x = -.18 + bend + Math.cos(a) * r,
					y = -.92 - t * .82,
					z = .02 + Math.sin(a) * r * .82;
				positions.push(x, y, z);
				base.push(x, y, z);
				const c = C.rose.clone().lerp(C.cyan, t * .5);
				colors.push(c.r, c.g, c.b);
				sizes.push(THREE.MathUtils.randFloat(.009, .023));
			}

			function addGroove(cx, cy, cz, rx, ry, rz, start, end, turns, count) {
				for (let i = 0; i < count; i++) {
					const t = i / (count - 1),
						a = start + (end - start) * t,
						wig = Math.sin(t * Math.PI * turns) * .095;
					groovePositions.push(
						cx + Math.cos(a) * rx + wig,
						cy + Math.sin(a) * ry + Math.sin(t * 18) * .025,
						cz + Math.sin(a * 1.2) * rz
					);
				}
			}

			addGroove(.20, .74, .70, 1.18, .22, .07, Math.PI * .96, Math.PI * 1.92, 6, 280);
			addGroove(.30, .34, .72, 1.24, .24, .06, Math.PI * .86, Math.PI * 1.78, 5, 260);
			addGroove(.15, -.11, .72, 1.16, .20, .05, Math.PI * .95, Math.PI * 1.78, 5, 260);
			addGroove(-.78, .08, .68, .54, .44, .05, Math.PI * .68, Math.PI * 1.86, 4, 210);
			addGroove(.82, .05, .70, .48, .40, .05, Math.PI * .12, Math.PI * 1.72, 4, 210);

			for (let i = 0; i < 480; i++) {
				const t = i / 479,
					y = .90 - t * 1.36,
					x = Math.sin(t * 18) * .02,
					z = .72 + Math.sin(t * 5) * .03;
				cleftPositions.push(x, y, z);
			}

			const geo = new THREE.BufferGeometry();
			geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
			geo.setAttribute('base', new THREE.Float32BufferAttribute(base, 3));
			geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
			geo.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));

			const mat = new THREE.ShaderMaterial({
				transparent: true,
				depthWrite: false,
				blending: THREE.AdditiveBlending,
				vertexColors: true,
				uniforms: {
					uTime: { value: 0 },
					uPulse: { value: 0 },
					uScale: { value: low ? 48 : 62 }
				},
				vertexShader: `attribute float aSize;attribute vec3 base;varying vec3 vColor;varying vec3 vBase;varying float vFlicker;varying float vEnergy;uniform float uTime,uPulse,uScale;void main(){vColor=color;vBase=base;vec3 p=position;float cortexWave=sin(base.y*9.0-uTime*1.8+base.x*2.0)*0.006;float neuralPulse=sin(length(base.xy)*8.5-uTime*3.1+uPulse*5.0)*0.010*uPulse;float microFlicker=sin(base.x*31.0+base.y*17.0+uTime*6.0)*0.5+0.5;p+=normalize(base)*(cortexWave+neuralPulse);vec4 mv=modelViewMatrix*vec4(p,1.0);vFlicker=microFlicker;vEnergy=neuralPulse;gl_PointSize=aSize*uScale*(1.0+uPulse*0.42+microFlicker*0.10)/max(0.72,-mv.z);gl_Position=projectionMatrix*mv;}`,
				fragmentShader: `varying vec3 vColor;varying vec3 vBase;varying float vFlicker;varying float vEnergy;void main(){vec2 uv=gl_PointCoord-0.5;float d=length(uv);float alpha=smoothstep(0.52,0.04,d);float core=smoothstep(0.18,0.0,d);float edge=pow(1.0-abs(normalize(vBase).z),1.75);float cleftShadow=smoothstep(0.22,0.02,abs(vBase.x));vec3 color=vColor;color*=0.70+edge*0.55;color+=vec3(0.0,0.62,1.0)*edge*0.25;color+=vec3(1.0,0.86,0.25)*max(vEnergy,0.0)*0.85;color*=1.0-cleftShadow*0.45;color*=0.88+vFlicker*0.10;gl_FragColor=vec4(color*(0.92+core*1.25),alpha*0.88);}`
			});

			const brain = new THREE.Points(geo, mat);
			brain.scale.set(1.58, 1.56, 1.72);
			brainGroup.add(brain);

			const grooveGeo = new THREE.BufferGeometry();
			grooveGeo.setAttribute('position', new THREE.Float32BufferAttribute(groovePositions, 3));
			const grooveMat = new THREE.PointsMaterial({
				size: low ? .018 : .023,
				color: 0x031325,
				transparent: true,
				opacity: .84,
				blending: THREE.NormalBlending,
				depthWrite: false
			});
			const grooves = new THREE.Points(grooveGeo, grooveMat);
			grooves.scale.copy(brain.scale);
			brainGroup.add(grooves);

			const glowGrooveMat = new THREE.PointsMaterial({
				size: low ? .008 : .011,
				color: 0x00dfff,
				transparent: true,
				opacity: .18,
				blending: THREE.AdditiveBlending,
				depthWrite: false
			});
			const glowGrooves = new THREE.Points(grooveGeo, glowGrooveMat);
			glowGrooves.scale.copy(brain.scale);
			brainGroup.add(glowGrooves);

			const cleftGeo = new THREE.BufferGeometry();
			cleftGeo.setAttribute('position', new THREE.Float32BufferAttribute(cleftPositions, 3));
			const cleftMat = new THREE.PointsMaterial({
				size: low ? .025 : .033,
				color: 0x010a13,
				transparent: true,
				opacity: .92,
				blending: THREE.NormalBlending,
				depthWrite: false
			});
			const cleft = new THREE.Points(cleftGeo, cleftMat);
			cleft.scale.copy(brain.scale);
			brainGroup.add(cleft);

			const linePositions = [], linePairs = [], total = positions.length / 3;
			for (let i = 0; i < (low ? 760 : 1500); i++) {
				const a = Math.floor(Math.random() * total),
					b = Math.floor(Math.random() * total),
					ax = positions[a * 3],
					ay = positions[a * 3 + 1],
					az = positions[a * 3 + 2],
					bx = positions[b * 3],
					by = positions[b * 3 + 1],
					bz = positions[b * 3 + 2],
					d = Math.hypot(ax - bx, ay - by, az - bz);
				if (d > .16 && d < .34) {
					linePositions.push(ax, ay, az, bx, by, bz);
					linePairs.push([ax, ay, az, bx, by, bz]);
				}
			}
			const lineGeo = new THREE.BufferGeometry();
			lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
			const lineMat = new THREE.LineBasicMaterial({
				color: 0x8eefff,
				transparent: true,
				opacity: .038,
				blending: THREE.AdditiveBlending,
				depthWrite: false
			});
			const lines = new THREE.LineSegments(lineGeo, lineMat);
			lines.scale.copy(brain.scale);
			brainGroup.add(lines);

			const sparkCount = low ? 55 : 120,
				sparkPositions = new Float32Array(sparkCount * 3),
				sparkColors = new Float32Array(sparkCount * 3),
				sparkSizes = new Float32Array(sparkCount),
				sparkMeta = [];
			for (let i = 0; i < sparkCount; i++) {
				const choice = Math.random(),
					c = choice > .84 ? C.gold.clone() : choice > .66 ? C.white.clone() : C.cyan.clone();
				sparkColors[i * 3] = c.r;
				sparkColors[i * 3 + 1] = c.g;
				sparkColors[i * 3 + 2] = c.b;
				sparkSizes[i] = THREE.MathUtils.randFloat(low ? .025 : .030, low ? .050 : .062);
				sparkMeta.push({
					lineIndex: Math.floor(Math.random() * Math.max(1, linePairs.length)),
					phase: Math.random(),
					speed: THREE.MathUtils.randFloat(.14, .40),
					offset: Math.random() * Math.PI * 2
				});
			}
			const sparkGeo = new THREE.BufferGeometry();
			sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
			sparkGeo.setAttribute('color', new THREE.BufferAttribute(sparkColors, 3));
			sparkGeo.setAttribute('aSize', new THREE.BufferAttribute(sparkSizes, 1));
			const sparkMat = new THREE.ShaderMaterial({
				transparent: true,
				depthWrite: false,
				blending: THREE.AdditiveBlending,
				vertexColors: true,
				uniforms: {
					uPulse: { value: 0 },
					uScale: { value: low ? 72 : 92 }
				},
				vertexShader: `attribute float aSize;varying vec3 vColor;uniform float uPulse,uScale;void main(){vColor=color;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=aSize*uScale*(1.0+uPulse*0.55)/max(0.72,-mv.z);gl_Position=projectionMatrix*mv;}`,
				fragmentShader: `varying vec3 vColor;void main(){vec2 uv=gl_PointCoord-0.5;float d=length(uv);float alpha=smoothstep(0.50,0.03,d);float core=smoothstep(0.16,0.0,d);gl_FragColor=vec4(vColor*(1.1+core*1.65),alpha*0.78);}`
			});
			const sparks = new THREE.Points(sparkGeo, sparkMat);
			sparks.scale.copy(brain.scale);
			brainGroup.add(sparks);

			function updateSparks(time) {
				if (!linePairs.length) return;
				for (let i = 0; i < sparkCount; i++) {
					const meta = sparkMeta[i],
						pair = linePairs[meta.lineIndex % linePairs.length],
						p = (meta.phase + time * meta.speed) % 1,
						pulseCurve = Math.sin(p * Math.PI),
						wiggle = Math.sin(time * 3.0 + meta.offset) * .014;
					sparkPositions[i * 3] = pair[0] + (pair[3] - pair[0]) * p + wiggle;
					sparkPositions[i * 3 + 1] = pair[1] + (pair[4] - pair[1]) * p + wiggle * .5;
					sparkPositions[i * 3 + 2] = pair[2] + (pair[5] - pair[2]) * p;
					sparkSizes[i] = (low ? .026 : .032) + pulseCurve * (low ? .022 : .034);
				}
				sparkGeo.attributes.position.needsUpdate = true;
				sparkGeo.attributes.aSize.needsUpdate = true;
			}

			const hotspots = [
				{ section: 'about', label: 'About', pos: [.98, .46, .64], color: 0xffe96a, cam: [1.70, .72, 2.75] },
				{ section: 'skills', label: 'Skills', pos: [-.08, .92, .60], color: 0x00dfff, cam: [.24, 1.42, 2.62] },
				{ section: 'experience', label: 'Experience', pos: [-.86, .28, .58], color: 0x2457ff, cam: [-1.22, .58, 2.78] },
				{ section: 'projects', label: 'Projects', pos: [.18, -.40, .62], color: 0x806cff, cam: [.54, -.52, 2.70] },
				{ section: 'contact', label: 'Contact', pos: [-.30, -1.18, .30], color: 0xffb6c9, cam: [-.48, -1.20, 2.92] }
			];
			const hotspotMeshes = [], hotGroup = new THREE.Group();
			brainGroup.add(hotGroup);
			hotspots.forEach(h => {
				const dot = new THREE.Mesh(
					new THREE.SphereGeometry(.058, 24, 24),
					new THREE.MeshStandardMaterial({
						color: h.color,
						emissive: h.color,
						emissiveIntensity: 2.5,
						roughness: .25
					})
				);
				dot.position.set(...h.pos);
				dot.userData = h;
				const ring = new THREE.Mesh(
					new THREE.TorusGeometry(.145, .007, 8, 48),
					new THREE.MeshBasicMaterial({
						color: h.color,
						transparent: true,
						opacity: .54,
						blending: THREE.AdditiveBlending
					})
				);
				ring.position.copy(dot.position);
				hotGroup.add(dot, ring);
				hotspotMeshes.push({ dot, ring, data: h });
			});

			const panel = document.getElementById('panel'),
				title = document.getElementById('title'),
				kicker = document.getElementById('kicker'),
				content = document.getElementById('content'),
				label = document.getElementById('label'),
				raycaster = new THREE.Raycaster(),
				pointer = new THREE.Vector2(9, 9);
			let hovered = null, active = null, pulse = 0, tween = null;
			const startCam = new THREE.Vector3(0, .14, 7.55),
				startTarget = new THREE.Vector3(.16, .03, 0);

			function world(local) {
				return new THREE.Vector3(...local).multiplyScalar(1.58).applyMatrix4(brainGroup.matrixWorld);
			}

			function moveCamera(toCam, toTarget, duration = 1050) {
				tween = {
					t: 0,
					duration,
					fromCam: camera.position.clone(),
					toCam: toCam.clone(),
					fromTarget: controls.target.clone(),
					toTarget: toTarget.clone()
				};
			}

			function ease(t) {
				return 1 - Math.pow(1 - t, 3);
			}

			function openSection(section) {
				const data = DATA[section],
					hot = hotspots.find(h => h.section === section);
				if (!data || !hot) return;
				active = section;
				title.textContent = data.title;
				kicker.textContent = data.kicker;
				content.innerHTML = data.html;
				panel.classList.add('active');
				document.body.classList.add('zoomed');
				controls.autoRotate = false;
				pulse = 1;
				moveCamera(world(hot.cam), world(hot.pos), 1100);
			}

			function closeSection() {
				active = null;
				panel.classList.remove('active');
				document.body.classList.remove('zoomed');
				controls.autoRotate = true;
				pulse = .7;
				moveCamera(startCam, startTarget, 900);
			}

			document.getElementById('closeBtn').addEventListener('click', closeSection);
			window.addEventListener('pointermove', e => {
				const r = canvas.getBoundingClientRect();
				pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
				pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
			}, { passive: true });
			canvas.addEventListener('click', () => {
				if (hovered) openSection(hovered.userData.section);
			});
			window.addEventListener('keydown', e => {
				if (e.key === 'Escape') closeSection();
			});

			function updateLabel() {
				if (!hovered) {
					label.classList.remove('visible');
					return;
				}
				const p = hovered.getWorldPosition(new THREE.Vector3()).project(camera);
				label.textContent = hovered.userData.label;
				label.style.left = `${(p.x * .5 + .5) * innerWidth}px`;
				label.style.top = `${(-p.y * .5 + .5) * innerHeight}px`;
				label.classList.add('visible');
			}

			const clock = new THREE.Clock();
			let visible = true;
			document.addEventListener('visibilitychange', () => visible = !document.hidden);

			function animate() {
				requestAnimationFrame(animate);
				if (!visible) return;
				const dt = clock.getDelta(),
					t = clock.elapsedTime;
				pulse *= .94;
				if (tween) {
					tween.t = Math.min(1, tween.t + (dt * 1000) / tween.duration);
					const e = ease(tween.t);
					camera.position.lerpVectors(tween.fromCam, tween.toCam, e);
					controls.target.lerpVectors(tween.fromTarget, tween.toTarget, e);
					if (tween.t >= 1) tween = null;
				}
				raycaster.setFromCamera(pointer, camera);
				const hits = raycaster.intersectObjects(hotspotMeshes.map(h => h.dot), false);
				hovered = hits.length ? hits[0].object : null;
				document.body.style.cursor = hovered ? 'pointer' : 'default';
				if (hovered) pulse = Math.max(pulse, .45);
				if (!active && !tween) brainGroup.rotation.y += .00078;
				brainGroup.rotation.z = Math.sin(t * .32) * .010;
				mat.uniforms.uTime.value = t;
				mat.uniforms.uPulse.value = pulse;
				sparkMat.uniforms.uPulse.value = Math.max(.12, pulse);
				updateSparks(t);
				lineMat.opacity = .035 + pulse * .045;
				glowGrooveMat.opacity = .13 + pulse * .13;
				bloom.strength += (.86 + pulse * .20 - bloom.strength) * .055;
				hotspotMeshes.forEach((h, i) => {
					const on = hovered === h.dot || active === h.data.section;
					h.dot.scale.setScalar(on ? 1.72 : 1 + Math.sin(t * 2.1 + i) * .07);
					h.ring.lookAt(camera.position);
					h.ring.scale.setScalar(1 + Math.sin(t * 2.4 + i) * .13 + (on ? .45 : 0));
					h.ring.material.opacity = on ? .88 : .46;
				});
				controls.update();
				updateLabel();
				composer.render();
			}
			animate();

			window.addEventListener('resize', () => {
				camera.aspect = innerWidth / innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(innerWidth, innerHeight);
				composer.setSize(innerWidth, innerHeight);
				bloom.setSize(innerWidth, innerHeight);
				mat.uniforms.uScale.value = innerWidth < 760 ? 48 : 62;
			});
		</script>
	</body>
</html>
